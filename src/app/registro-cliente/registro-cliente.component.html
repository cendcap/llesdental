<div class="registro-background">
  <div class="registro-container">
    <h1>Registro de Cliente</h1>
    <form [formGroup]="registroForm" (ngSubmit)="registrar()">
      <input type="text" formControlName="nombre" placeholder="Nombre" />
      <input type="text" formControlName="cedula" placeholder="Cédula" />

      <ngx-intl-tel-input
        [cssClass]="'form-control'"
        [preferredCountries]="[CountryISO.Ecuador, CountryISO.Colombia]"
        [enableAutoCountrySelect]="false"
        [enablePlaceholder]="true"
        [searchCountryFlag]="true"
        [searchCountryField]="searchFields"
        [selectFirstCountry]="false"
        [selectedCountryISO]="selectedCountryISO"
        name="celular"
        formControlName="celular">
      </ngx-intl-tel-input>

      <input type="email" formControlName="correo" placeholder="Correo" />
      <input type="date" formControlName="fechaNacimiento" placeholder="Fecha de Nacimiento"
    required
  />

      <button type="submit">Registrarse</button>
    </form>
    <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a></p>
  </div>
</div>
