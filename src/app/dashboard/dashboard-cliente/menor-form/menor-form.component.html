<form *ngIf="menorForm" [formGroup]="menorForm" (ngSubmit)="registrarMenor()" class="menor-form">
  <h2>Registro de Menor</h2>

  <div class="form-group">
    <label>Nombre completo<span>*</span>:</label>
    <input type="text" formControlName="nombre" required />
  </div>

  <div class="form-group">
    <label>Cédula<span>*</span>:</label>
    <input type="text" formControlName="cedula" required />
  </div>

  <div class="form-group">
    <label>Celular:</label>
    <input type="text" formControlName="celular" />
  </div>

  <div class="form-group">
    <label>Correo electrónico:</label>
    <input type="email" formControlName="correo" />
  </div>

  <div class="form-group">
    <label>Fecha de nacimiento<span>*</span>:</label>
    <input type="date" formControlName="fechaNacimiento" required />
  </div>

  <button type="submit" [disabled]="menorForm.invalid">Registrar Menor</button>
</form>
